# Data directory and file configuration
processed_data_dir: /gpfs/radev/home/jc4439/martinez_project/pop/data/tcell/all
fold_idx: 0
h5ad_filename: tcells_all_fold${data.fold_idx}_fix.h5ad

# Column names
condition_col: gene
cluster_col: cluster_name
control_condition: NO-TARGET

# Split configuration
split_col: split_${data.fold_idx}

# Embedding keys
cell_embed_key: X_scgpt_CP_512  # X or in adata.obsm "scVI_10", "scGPT", ...
pert_embedding_key: esm2_gene_embedding_2560  # in adata.uns
encoder_variant: ""  # Optional submission alias: scgpt512, pca100_train, hvg5000_train
encoder_pca_n_comps: 100
encoder_hvg_top_genes: 5000

# Matching configuration
matching_index_path: ${data.processed_data_dir}/matching_index.pkl
compute_matching: false  # Whether to compute or load matching index

use_matched_control: true  # Whether to use matched control cells or random sampling

# Condition mode: "pure" (single perturbation per bag) or "mixed" (multiple perturbations per bag)
condition_mode: mixed
