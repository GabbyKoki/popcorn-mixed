# @package _global_
defaults:
  - _self_
  - override /data: schmidt
  - override /model: default
  - override /training: default
  - override /logger: hyper_test

# Sweep configuration for ablation study
hydra:
  sweeper:
    params:
      data.fold_idx: 0,1,2,3,4 # Specify which fold to test
      # Two specific configs to try, as requested
      model.hidden_dim: 512,256
      model.n_heads: 4
      model.num_layers: 1,2
      model.dropout: 0.4
      model.cell_loss_weight: 0.8,0.0
      training.n_bags: 100,50
      training.sample_ratio: 0.3,0.5
      training.batch_size: 16,32
      model.lr: 0.001,0.01