# @package _global_
defaults:
  - _self_
  - override /data: schmidt
  - override /model: default
  - override /training: default
  - override /logger: hyper
  - override /hydra/sweeper: optuna

hydra:
  sweep:
    dir: logs/sweep
    subdir: run_${hydra.job.num}
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
    direction: maximize
    study_name: pop_mixed_optuna
    n_trials: 80
    n_jobs: 1
    params:
      # Discrete/choice spaces
      model.hidden_dim: choice(256,512)
      model.num_layers: choice(1,2)
      # Continuous spaces
      model.lr: tag(log, interval(1e-4, 1e-2)) 
      training.n_bags: choice(20,50,100)
      training.sample_ratio: choice(0.3,0.5,0.7)

      