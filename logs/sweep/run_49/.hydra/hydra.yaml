hydra:
  run:
    dir: logs/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: logs/sweep
    subdir: run_${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      consider_prior: true
      prior_weight: 1.0
      consider_magic_clip: true
      consider_endpoints: false
      n_startup_trials: 10
      n_ei_candidates: 24
      multivariate: false
      warn_independent_sampling: true
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    direction: maximize
    storage: null
    study_name: pop_mixed_optuna
    n_trials: 80
    n_jobs: 1
    search_space: null
    params:
      model.hidden_dim: choice(64,128,256,512)
      model.n_heads: choice(4,8)
      model.num_layers: choice(1,2,3)
      model.dropout: choice(0.1,0.2,0.4)
      model.cell_loss_weight: choice(0.0,0.2,0.5)
      model.lr: tag(log, interval(1e-4, 1e-2))
      training.n_bags: choice(10,50,100)
      training.sample_ratio: choice(0.3,0.5,0.8,1.0)
      training.sampler_type: choice("bootstrap", "stratified", "uniform")
    custom_search_space: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - model.hidden_dim=256
    - model.n_heads=8
    - model.num_layers=1
    - model.dropout=0.1
    - model.cell_loss_weight=0.2
    - model.lr=0.0010634112172633737
    - training.n_bags=100
    - training.sample_ratio=0.8
    - training.sampler_type=bootstrap
    - +sweep=optuna
  job:
    name: train
    chdir: null
    override_dirname: +sweep=optuna,model.cell_loss_weight=0.2,model.dropout=0.1,model.hidden_dim=256,model.lr=0.0010634112172633737,model.n_heads=8,model.num_layers=1,training.n_bags=100,training.sample_ratio=0.8,training.sampler_type=bootstrap
    id: '49'
    num: 49
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /gpfs/radev/project/martinez_maria/jc4439/pop/pop-mix-samples
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /gpfs/radev/project/martinez_maria/jc4439/pop/pop-mix-samples/conf
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: /gpfs/radev/project/martinez_maria/jc4439/pop/pop-mix-samples/logs/sweep/run_49
    choices:
      sweep: optuna
      logger: hyper
      training: default
      model: default
      data: schmidt
      paths: default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: optuna
      hydra/sweeper/sampler: tpe
      hydra/launcher: basic
      hydra/output: default
  verbose: false
